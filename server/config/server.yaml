llm:
  provider: hermes
  model: zod-qwen3-coder:30b
  api_key_env: ANTHROPIC_API_KEY
  max_tokens: 220
  temperature: 0.3
  history_turns: 12
hermes:
  base_url: http://127.0.0.1:8642
  api_key_env: API_SERVER_KEY
  conversation: zod-hud-main
  session_key: zod:user:main
  # Verification-phase value. A cold zod-qwen3-coder:30b load was measured at
  # 264.5s, which exceeded the previous 240s budget and turned any load-bearing
  # turn into a guaranteed timeout. Retune downward once resource-aware model
  # residency is stable. The approval timeout is deliberately unchanged (300s).
  timeout: 900
  ack_after_seconds: 0
  ack_texts:
  - On it.
  - Still working.
  - Almost there.
  fallback_provider: null
  instructions: 'You are speaking aloud through a voice pipeline. Replies are converted
    to speech, so use plain conversational prose only: no markdown, no lists, no code
    blocks. Default to one to three short sentences unless asked for more detail.
    Speak numbers, dates, times and phone numbers as natural spoken words. Never speak
    secrets, API keys, or passwords aloud.

    '
  model: zod-qwen3-coder:30b
  provider: custom
stt:
  model: small.en
  device: cpu
  compute_type: int8
  sample_rate: 16000
  partials: true
  partial_interval: 1.2
  initial_prompt: Zod
  warm_on_startup: false
machines:
- name: GPU WORKER
  host: 192.168.1.50
  stats_url: http://192.168.1.50:8767/stats
  ping_port: 445
usage:
  llm_cost_per_mtok_input: 0
  llm_cost_per_mtok_output: 0
server:
  host: 127.0.0.1
  port: 8765
  tls_ports: []
  tls_cert: certs/cert.pem
  tls_key: certs/key.pem
  dashboard_proxy:
    port: 9443
    target: http://127.0.0.1:9119
security:
  hud_token_env: JARVIS_HUD_TOKEN
  extra_origin_hosts: []
voice:
  provider: macos
  # Zod's voice: male, deep, calm, and entirely local. Selected by measuring the
  # voices actually installed on this Mac (median F0 on one identical sentence):
  # Ralph 70Hz and Rocko 83Hz are deeper but are legacy formant / character
  # voices that read as cartoonish; Daniel is 112.5Hz, unambiguously male, and a
  # full-quality long-form voice that stays natural across a conversation.
  # WARNING: Alex, Tom, Aaron, Evan, Oliver, Arthur and Gordon are NOT installed
  # here. `say -v <name>` still exits 0 for them and silently falls back to the
  # default female voice, so do not "fix" the voice by naming one of those.
  # Applied only after the voice path was proven working end to end, never
  # before — a working voice is not traded for a different character.
  macos_voice: Daniel
  # Optional words-per-minute for `say -r`. Empty keeps the voice's own pacing,
  # which measured as the most fluent of the candidates.
  macos_rate: ''
persona:
  system_prompt: 'You are the spoken interface for the user''s personal agent. Be
    direct, calm, and concise. Default to one to three short sentences.

    '
